name: CI/CD MLflow

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

env:
  CSV_URL: "MLProject/Predictive_Maintenance_Preproces.csv"
  TARGET_VAR: "Maintenance_Prediction"

jobs:
  train-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Set up Python 3.12.7
        uses: actions/setup-python@v4
        with:
          python-version: "3.12.7"
          
      - name: Check Env
        run: |
          echo $CSV_URL
          
      - name: Set up Conda
        uses: conda-incubator/setup-miniconda@v2
        with:
          environment-file: MLProject/conda.yaml
          activate-environment: Maintenance-Prediction
          auto-activate-base: false

      - name: Initialize Conda
        run: |
          echo "Initializing Conda for bash"
          conda init bash
          source ~/.bashrc
          
      - name: Install MLflow and dependencies
        shell: bash -l {0}
        run: |
          conda activate Maintenance-Prediction
          python -m pip install --upgrade pip
          pip install mlflow
          pip install -r requirements.txt


      - name: Run mlflow project
        shell: bash -l {0}
        run: |
          conda activate Maintenance-Prediction
          mlflow run MLProject --env-manager=local


      - name: Get latest MLflow run_id
        run: |
          RUN_ID=$(ls -td mlruns/0/*/ | head -n 1 | cut -d'/' -f3)
          echo "RUN_ID=$RUN_ID" >> $GITHUB_ENV
          echo "Latest run_id: $RUN_ID"

      # Build Docker Model
      - name: Build Docker Model
        run: |
          source ~/.bashrc
          conda activate Maintenance-Prediction
          mlflow models build-docker \
            --model-uri "runs:/61202f879dc64cc8bbee3f48e703c8fc/model" \
            --name prediction-maintenance

      # ✅ Login ke Docker Hub

          
      - name: Log in to Docker Hub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKER_HUB_USERNAME }}
          password: ${{ secrets.DOCKER_HUB_ACCESS_TOKEN }}

      - name: Tag Docker Image
        run: |
          docker tag prediction-maintenance \
          ${{ secrets.DOCKER_HUB_USERNAME }}/prediction-maintenance:latest

      - name: Push Docker Image
        run: |
          docker push \
          ${{ secrets.DOCKER_HUB_USERNAME }}/prediction-maintenance:latest
