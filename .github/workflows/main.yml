name: CI/CD MLflow

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

env:
  CSV_URL: "MLProject/Predictive_Maintenance_Preproces.csv"
  TARGET_VAR: "Maintenance_Prediction"

jobs:
  train-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3
      - name: Set up Python 3.10
        uses: actions/setup-python@v4
        with:
          python-version: "3.10"

      - name: Check Env
        run: |
          echo "CSV_URL=$CSV_URL"
          echo "TARGET_VAR=$TARGET_VAR"
          
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          # Kita butuh library ini di environment runner agar bisa setup experiment
          pip install mlflow pandas scikit-learn numpy
          
      - name: Set up Conda
        uses: conda-incubator/setup-miniconda@v2
        with:
          environment-file: MLProject/conda.yaml
          activate-environment: Maintenance-Prediction
          auto-activate-base: false

          
      # ===============================
      # Install MLflow & dependencies
      # ===============================
      - name: Setup MLflow Experiment
        run: |
          # Step ini khusus untuk membuat struktur folder mlruns dan mendaftarkan experiment
          python -c "
          import mlflow
          mlflow.set_tracking_uri('${{ env.MLFLOW_TRACKING_URI }}')
          mlflow.set_experiment('${{ env.EXPERIMENT_NAME }}')
          print(f'Experiment {{ env.EXPERIMENT_NAME }} created successfully at {{ env.MLFLOW_TRACKING_URI }}')
          "

      # ===============================
      # Run MLflow Project
      # ===============================
      - name: Run mlflow project
        run: |
          # Kita pass nama experiment ke dalam mlflow run
          mlflow run MLproject --env-manager=local --experiment-name ${{ env.EXPERIMENT_NAME }}

      # ===============================
      # Get latest MLflow run_id
      # ===============================
      - name: Get latest MLflow run_id
        shell: bash -l {0}
        run: |
          echo "Checking mlruns directory"
          ls -l MLProject/mlruns/0/

          RUN_ID=$(ls -td MLProject/mlruns/0/*/ | head -n 1 | cut -d'/' -f4)
          echo "RUN_ID=$RUN_ID" >> $GITHUB_ENV
          echo "Latest run_id: $RUN_ID"

      # ===============================
      # Verify model artifact exists
      # ===============================
      - name: Verify model artifact
        shell: bash -l {0}
        run: |
          if [ ! -d "MLProject/mlruns/0/$RUN_ID/artifacts/model" ]; then
            echo "❌ Model artifact not found!"
            exit 1
          fi
          echo "✅ Model artifact found"

      # ===============================
      # Build Docker Image from MLflow Model
      # ===============================
      - name: Build Docker Image
        shell: bash -l {0}
        run: |
          mlflow models build-docker \
            --model-uri "file://$GITHUB_WORKSPACE/MLProject/mlruns/0/$RUN_ID/artifacts/model" \
            --name maintenance-model

      # ===============================
      # Login Docker Hub
      # ===============================
      - name: Log in to Docker Hub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKER_HUB_USERNAME }}
          password: ${{ secrets.DOCKER_HUB_ACCESS_TOKEN }}

      # ===============================
      # Tag Docker Image
      # ===============================
      - name: Tag Docker Image
        run: |
          docker tag maintenance-model \
            ${{ secrets.DOCKER_HUB_USERNAME }}/${{ secrets.DOCKER_HUB_REPO }}:latest

      # ===============================
      # Push Docker Image
      # ===============================
      - name: Push Docker Image
        run: |
          docker push \
            ${{ secrets.DOCKER_HUB_USERNAME }}/${{ secrets.DOCKER_HUB_REPO }}:latest
