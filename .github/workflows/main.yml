name: CI/CD MLflow

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

env:
  CSV_URL: "MLProject/Predictive_Maintenance_Preproces.csv"
  TARGET_VAR: "Maintenance_Prediction"

jobs:
  train-and-deploy:
    runs-on: ubuntu-latest

    steps:
      # ===============================
      # Checkout repository
      # ===============================
      - name: Checkout repository
        uses: actions/checkout@v3

      # ===============================
      # Setup Python
      # ===============================
      - name: Set up Python 3.10
        uses: actions/setup-python@v4
        with:
          python-version: "3.10"

      # ===============================
      # Check environment variables
      # ===============================
      - name: Check Env
        run: |
          echo "CSV_URL=$CSV_URL"
          echo "TARGET_VAR=$TARGET_VAR"

      # ===============================
      # Setup Conda
      # ===============================
      - name: Set up Conda
        uses: conda-incubator/setup-miniconda@v2
        with:
          environment-file: MLProject/conda.yaml
          activate-environment: Maintenance-Prediction
          auto-activate-base: false

      # ===============================
      # Initialize Conda
      # ===============================
      - name: Initialize Conda
        run: |
          conda init bash
          source ~/.bashrc

      # ===============================
      # Install MLflow & dependencies
      # ===============================
      - name: Install MLflow and dependencies
        shell: bash -l {0}
        run: |
          python -m pip install --upgrade pip
          pip install mlflow
          pip install -r MLProject/requirements.txt

      # ===============================
      # Run MLflow Project
      # ===============================
      - name: Run MLflow Project
        shell: bash -l {0}
        run: |
          cd MLProject
          mlflow run . -P data_path=Predictive_Maintenance_Preproces.csv --env-manager=local

      # ===============================
      # Get latest MLflow run_id
      # ===============================
      - name: Get latest MLflow run_id
        run: |
          echo "Checking mlruns directory"
          ls -l MLProject/mlruns/0/

          RUN_ID=$(ls -td MLProject/mlruns/0/*/ | head -n 1 | cut -d'/' -f4)
          echo "RUN_ID=$RUN_ID" >> $GITHUB_ENV
          echo "Latest run_id: $RUN_ID"

      # ===============================
      # Verify model artifact exists
      # ===============================
      - name: Verify model artifact
        shell: bash -l {0}
        run: |
          if [ ! -d "MLProject/mlruns/0/$RUN_ID/artifacts/model" ]; then
            echo "❌ Model artifact not found!"
            exit 1
          fi
          echo "✅ Model artifact found"

      # ===============================
      # Build Docker Image from MLflow Model
      # ===============================
      - name: Build Docker Image
        shell: bash -l {0}
        run: |
          mlflow models build-docker \
            --model-uri "file://$GITHUB_WORKSPACE/MLProject/mlruns/0/$RUN_ID/artifacts/model" \
            --name maintenance-model

      # ===============================
      # Login Docker Hub
      # ===============================
      - name: Log in to Docker Hub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKER_HUB_USERNAME }}
          password: ${{ secrets.DOCKER_HUB_ACCESS_TOKEN }}

      # ===============================
      # Tag Docker Image
      # ===============================
      - name: Tag Docker Image
        run: |
          docker tag maintenance-model \
            ${{ secrets.DOCKER_HUB_USERNAME }}/${{ secrets.DOCKER_HUB_REPO }}:latest

      # ===============================
      # Push Docker Image
      # ===============================
      - name: Push Docker Image
        run: |
          docker push \
            ${{ secrets.DOCKER_HUB_USERNAME }}/${{ secrets.DOCKER_HUB_REPO }}:latest
